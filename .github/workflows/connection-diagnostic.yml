name: TimePro Connection Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Diagnose anonymous connection once
        # No secrets, retries, login, screenshots, traces or uploaded artifacts.
        # Suppress library stderr: only the script's structured stdout is public.
        run: python scripts/timepro_connection_diagnostic.py 2>/dev/null
